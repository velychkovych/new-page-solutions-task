[project]
name = "helpdesk"
version = "0.1.0"
description = "IT helpdesk agent: LangGraph agent, MCP server and mock ticketing API"
authors = [
    { name = "bohdanvelychkovych", email = "boda.velich@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "aiosqlite>=0.22.1",
    "fastapi>=0.143.2",
    "httpx>=0.28.1",
    "langchain>=1.4.6",
    "langchain-anthropic>=1.7.6",
    "langchain-aws>=1.9.0",
    "langchain-core>=1.6.11",
    "langchain-mcp-adapters>=0.3.2",
    "langchain-openai>=1.7.2",
    "langgraph>=1.2.15",
    "langgraph-checkpoint-sqlite>=3.1.2",
    "mcp>=1.30.0",
    "openinference-instrumentation-langchain>=0.1.79",
    "opentelemetry-exporter-otlp-proto-http>=1.45.1",
    "opentelemetry-instrumentation-fastapi>=0.66b1",
    "opentelemetry-instrumentation-httpx>=0.66b1",
    "opentelemetry-sdk>=1.45.1",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "pyyaml>=6.0.3",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "deepeval>=4.3.0",
    "mypy>=2.4.0",
    "nodejs-wheel-binaries>=24.19.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.17.1",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.uv]
# A plain `uv sync` installs dev tools too, so `make lint typecheck test` works after setup.
default-groups = ["dev"]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "tests"]
extend-exclude = [".venv"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "SIM", "RUF", "ASYNC", "PT", "S", "T20", "PL", "TID",
]
ignore = [
    "PLR0913", # FastAPI routes and MCP tools legitimately take many parameters
    "PLR2004", # magic values in comparisons are fine for HTTP status codes
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PLR2004", "S603", "S607"]
"evals/**" = ["T20", "S101"]
"scripts/**" = ["T20"]

[tool.ruff.lint.isort]
# The eval runner package at the repo root (`python -m evals.run`).
known-first-party = ["evals"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src", "evals"]
plugins = ["pydantic.mypy"]
warn_unreachable = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
# The repo root, so tests can import the `evals` package (run as `python -m evals.run`).
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# deepeval (dev group, for evals/) installs pytest plugins that load into every session:
# its own (Confident AI test runs, telemetry), xdist, repeat and rerunfailures. Disabled,
# so `make test` runs exactly as before; evals/ uses DeepEval as a library, not a plugin.
addopts = [
    "-ra", "--import-mode=importlib", "--strict-markers", "--strict-config",
    "-m", "not e2e and not live",
    "-p", "no:deepeval", "-p", "no:xdist", "-p", "no:xdist.looponfail",
    "-p", "no:repeat", "-p", "no:rerunfailures",
]
# deepeval's tracing decorator calls asyncio.iscoroutinefunction (deprecated in 3.14) for
# every metric and judge method; a third-party warning we cannot act on.
filterwarnings = ["ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning:deepeval"]
markers = [
    "e2e: needs the docker compose stack (`make up`); run with `make test-e2e`",
    "live: calls a real model API; never part of `make test`",
]
