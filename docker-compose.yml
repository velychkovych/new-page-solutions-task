# Network isolation enforces "the agent reaches the mock only via MCP":
#   agent <-> mcp  on `agent_net`
#   mcp   <-> mock on `mock_net`
# The agent has no route to the mock and no MOCK_API_TOKEN in its environment.
# Each service gets an explicit `environment:` list (no env_file), so a secret in
# .env reaches only the service that needs it.

x-telemetry-env: &telemetry-env
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  TRACES_DIR: /app/traces
  # Empty = JSONL only. `make up OBS=1` sets it to http://jaeger:4318.
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}

x-healthcheck: &healthcheck
  interval: 5s
  timeout: 3s
  retries: 12
  start_period: 5s

services:
  mock:
    build: .
    image: helpdesk:local
    command: ["python", "-m", "helpdesk.mock"]
    environment:
      <<: *telemetry-env
      MOCK_HOST: 0.0.0.0
      MOCK_PORT: "8000"
      MOCK_DB_PATH: /app/data/mock.sqlite
      MOCK_API_TOKEN: ${MOCK_API_TOKEN:?run `make setup` to create .env}
      MOCK_ADMIN_TOKEN: ${MOCK_ADMIN_TOKEN:?run `make setup` to create .env}
      CHAOS_ENABLED: ${CHAOS_ENABLED:-false}
      CHAOS_RATE_LIMIT_RATE: ${CHAOS_RATE_LIMIT_RATE:-0}
      CHAOS_ERROR_RATE: ${CHAOS_ERROR_RATE:-0}
      CHAOS_SLOW_RATE: ${CHAOS_SLOW_RATE:-0}
      CHAOS_SLOW_MS: ${CHAOS_SLOW_MS:-2000}
      CHAOS_SEED: ${CHAOS_SEED:-0}
      CHAOS_FAIL_AFTER_COMMIT_RATE: ${CHAOS_FAIL_AFTER_COMMIT_RATE:-0}
    volumes:
      - mock_data:/app/data
      - ./traces:/app/traces
    networks: [mock_net]
    # No published port: on Docker Desktop a published port is reachable from every
    # container via host.docker.internal, which would give the agent a route to the mock.
    # Host tooling uses `docker compose exec mock` instead (CONTRACTS.md §7).
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]

  mcp:
    image: helpdesk:local
    command: ["python", "-m", "helpdesk.mcp_server"]
    environment:
      <<: *telemetry-env
      # 0.0.0.0 also keeps FastMCP's localhost-only DNS-rebinding guard off, so `Host: mcp` works.
      MCP_HOST: 0.0.0.0
      MCP_PORT: "8001"
      MOCK_URL: http://mock:8000
      MOCK_API_TOKEN: ${MOCK_API_TOKEN:?run `make setup` to create .env}
    volumes:
      - ./traces:/app/traces
    networks: [agent_net, mock_net]
    ports: ["127.0.0.1:8001:8001"]
    depends_on:
      mock: {condition: service_healthy}
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=2)"]

  agent:
    image: helpdesk:local
    command: ["python", "-m", "helpdesk.agent"]
    environment:
      <<: *telemetry-env
      AGENT_HOST: 0.0.0.0
      AGENT_PORT: "8080"
      MCP_URL: http://mcp:8001/mcp
      MODEL_PROVIDER: ${MODEL_PROVIDER:-anthropic}
      MODEL_NAME: ${MODEL_NAME:-claude-haiku-5-5}
      MODEL_MAX_TOKENS: ${MODEL_MAX_TOKENS:-1024}
      MODEL_TIMEOUT_S: ${MODEL_TIMEOUT_S:-60}
      MODEL_MAX_RETRIES: ${MODEL_MAX_RETRIES:-2}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AWS_REGION: ${AWS_REGION:-}
      FAKE_MODEL_SCRIPT: ${FAKE_MODEL_SCRIPT:-}
      CHECKPOINT_DB_PATH: /app/data/checkpoints.sqlite
      STORE_DB_PATH: /app/data/store.sqlite
      RECURSION_LIMIT: ${RECURSION_LIMIT:-25}
      TURN_DEADLINE_S: ${TURN_DEADLINE_S:-90}
      JAEGER_UI_URL: ${JAEGER_UI_URL:-}
      WEB_DIR: /app/web
    volumes:
      - agent_data:/app/data
      - ./traces:/app/traces
    networks: [agent_net]
    ports: ["127.0.0.1:8080:8080"]
    # Shutdown lets a running turn finish, so it can save its checkpoint: up to 5 s for
    # open connections (GRACEFUL_SHUTDOWN_S in agent/__main__.py), then the drain, bounded
    # by TURN_DEADLINE_S (90 s by default). Docker's default 10 s would SIGKILL it first.
    stop_grace_period: 100s
    depends_on:
      mcp: {condition: service_healthy}
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)"]

  # The e2e twin of `agent` (profile `e2e`, started by `make test-e2e`): the same image
  # with the scripted fake model, so the e2e tests need no model key and are
  # deterministic. Its own port, data volume and TRACES_DIR, so its checkpoints and spans
  # never mix with the browser agent's.
  agent-e2e:
    profiles: [e2e]
    image: helpdesk:local
    command: ["python", "-m", "helpdesk.agent"]
    environment:
      <<: *telemetry-env
      # A subdirectory: two agent processes must not append to the same JSONL file.
      TRACES_DIR: /app/traces/e2e
      AGENT_HOST: 0.0.0.0
      AGENT_PORT: "8080"
      MCP_URL: http://mcp:8001/mcp
      MODEL_PROVIDER: fake
      FAKE_MODEL_SCRIPT: /app/e2e/fake_model_script.json
      CHECKPOINT_DB_PATH: /app/data/checkpoints.sqlite
      STORE_DB_PATH: /app/data/store.sqlite
      JAEGER_UI_URL: ${JAEGER_UI_URL:-}
      WEB_DIR: /app/web
    volumes:
      - agent_e2e_data:/app/data
      - ./traces:/app/traces
      - ./tests/e2e/fixtures:/app/e2e:ro
    networks: [agent_net]
    ports: ["127.0.0.1:8081:8080"]
    stop_grace_period: 100s  # as for `agent`
    depends_on:
      mcp: {condition: service_healthy}
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)"]

  # The eval twin of `agent` (profile `eval`, started by `python -m evals.run`): the same
  # image, command and model settings, real model key included, but its own port, data
  # volume and TRACES_DIR. The runner resets facts for the seed users and may switch
  # MODEL_NAME (`--model`), and neither may touch the browser agent.
  agent-eval:
    profiles: [eval]
    image: helpdesk:local
    command: ["python", "-m", "helpdesk.agent"]
    environment:
      <<: *telemetry-env
      # A subdirectory: two agent processes must not append to the same JSONL file.
      TRACES_DIR: /app/traces/eval
      AGENT_HOST: 0.0.0.0
      AGENT_PORT: "8080"
      MCP_URL: http://mcp:8001/mcp
      MODEL_PROVIDER: ${MODEL_PROVIDER:-anthropic}
      MODEL_NAME: ${MODEL_NAME:-claude-haiku-5-5}
      MODEL_MAX_TOKENS: ${MODEL_MAX_TOKENS:-1024}
      MODEL_TIMEOUT_S: ${MODEL_TIMEOUT_S:-60}
      MODEL_MAX_RETRIES: ${MODEL_MAX_RETRIES:-2}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AWS_REGION: ${AWS_REGION:-}
      CHECKPOINT_DB_PATH: /app/data/checkpoints.sqlite
      STORE_DB_PATH: /app/data/store.sqlite
      RECURSION_LIMIT: ${RECURSION_LIMIT:-25}
      TURN_DEADLINE_S: ${TURN_DEADLINE_S:-90}
      JAEGER_UI_URL: ${JAEGER_UI_URL:-}
      WEB_DIR: /app/web
    volumes:
      - agent_eval_data:/app/data
      - ./traces:/app/traces
    networks: [agent_net]
    ports: ["127.0.0.1:8082:8080"]
    stop_grace_period: 100s  # as for `agent`
    depends_on:
      mcp: {condition: service_healthy}
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)"]

  jaeger:
    profiles: [observability]
    image: jaegertracing/jaeger:2.22.0
    # On both networks so every service can export to it. A container on two networks
    # does not route between them, so this does not connect the agent to the mock.
    networks: [agent_net, mock_net]
    ports:
      - "127.0.0.1:16686:16686"  # UI
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:13133/status"]

networks:
  agent_net: {}
  mock_net: {}

volumes:
  mock_data: {}
  agent_data: {}
  agent_e2e_data: {}
  agent_eval_data: {}
