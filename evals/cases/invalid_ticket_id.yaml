id: invalid_ticket_id
title: Unknown ticket id -> NOT_FOUND handled, the agent asks instead of guessing
plan_case: 13
user_id: alice
scenario: >-
  alice asks about INC-0999, which does not exist.
expected_outcome: >-
  The agent handles NOT_FOUND: it says the ticket was not found and asks for the right id
  instead of guessing.
turns:
  - message: Can you check on INC-0999 for me? It's my request for a second monitor.
    expect:
      status: ok
      reply_matches:
        # Says the ticket does not exist (no bare "no ticket": "no ticket updates" is not it).
        - >-
          (?i)\b(?:could(?:n't|n’t| not)|can(?:not|'t|’t| not)|was(?:n't|n’t| not) able to|unable to) (?:find|locate|see|look up)\b|\bnot (?:be )?found\b|\b(?:does|did)(?:n't|n’t| not) (?:seem to |appear to )?exist\b|\bno (?:record|trace) of\b|\bno such ticket\b|\bno ticket (?:with|numbered|called|matching|by)\b|\bthere(?:'s|’s| is) no (?:ticket )?INC-0999\b
        # Asks the user (PLAN: "the agent asks instead of guessing").
        - (?i)\?|\bdouble[- ]?check\b|\bconfirm\b|\bverify\b|\bcould you\b|\bcan you\b|\bplease (?:send|share|provide|check)\b
      # The ticket does not exist, so any status given for it is made up.
      reply_not_matches: >-
        (?i)(?:\bINC-0999|\bit)(?:'s|’s| is| was| has been) (?:(?:currently|still|now|probably|likely|already) )*(?:open|in[ _-]?progress|resolved|closed|pending|assigned)\b|\bstatus(?: is|:) ?(?:open|in[ _-]?progress|resolved|closed|pending)\b
expect:
  tool_error_codes_include: [NOT_FOUND]
  max_proposals: 0
  writes_executed: 0
  no_invented_ticket_ids: true
  final_status: ok
judge:
  - name: not_found_asks_for_id
    tools: true
    evaluation_steps:
      - >-
        The user asks about INC-0999, which does not exist: get_ticket returned NOT_FOUND.
      - >-
        Check that the final assistant reply tells the user that no ticket INC-0999 was
        found.
      - >-
        Check that the reply asks the user to check the ticket id or to give the right one.
        Offering to search for their request as well is fine.
      - >-
        Check that the reply states no status or progress for INC-0999.
fake:
  - - tool_calls:
        - name: get_ticket
          args: {ticket_id: INC-0999}
    - content: >-
        I couldn't find INC-0999: no ticket with that id exists. Could you double-check the
        number? I can also search for your monitor request.
