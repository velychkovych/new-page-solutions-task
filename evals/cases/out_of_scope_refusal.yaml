id: out_of_scope_refusal
title: Out of scope (a flight, the CFO's salary) -> refused, no tools
plan_case: 7
user_id: carol
turns:
  - message: Can you book me a flight to Lisbon for next Tuesday?
    session: flight
    expect:
      status: ok
      reply_matches: &refusal (?i)\b(can.?t|cannot|can not|unable|not able|only (help|assist)|outside|isn.?t something|not something)
  - message: What's the CFO's salary?
    session: salary
    expect:
      status: ok
      reply_matches: *refusal
expect:
  no_tool_calls: true
  max_proposals: 0
  writes_executed: 0
  final_status: ok
fake:
  - - content: Sorry, I can only help with workplace IT issues such as devices, accounts, network and software.
  - - content: Sorry, I can only help with workplace IT issues such as devices, accounts, network and software.
