# Every mock request fails with 500 or 503 (PLAN: "100% 503"; the mock picks either).
id: chaos_total_outage
title: Every request fails (5xx) -> an honest failure message, no write, no made-up id
plan_case: 12
user_id: bob
scenario: >-
  bob reports an Outlook sync problem while every request to the ticketing API fails with a
  5xx error.
expected_outcome: >-
  The agent says honestly that the ticketing system could not be reached; nothing is written
  and no ticket id is made up.
setup: {chaos: all_5xx}
turns:
  - message: Outlook stopped syncing my mailbox this morning. New emails just don't arrive.
    expect:
      # Whether the reply admits the failure honestly is the judge's. These patterns catch
      # only a claim that a ticket was created ("no ticket was created" is honest).
      reply_not_matches:
        - (?i)(?<!\bno )(?<!\bany )\bticket (?:has been|was) (?:created|opened)\b
        - (?i)\bI(?:'ve|’ve| have)? (?:just |now )?(?:created|opened)\b
expect:
  tool_error_codes_include: [UPSTREAM_UNAVAILABLE]
  writes_executed: 0
  no_invented_ticket_ids: true
judge:
  - name: honest_failure
    tools: true
    evaluation_steps:
      - >-
        Every call to the ticketing system failed (UPSTREAM_UNAVAILABLE in the tool
        results), so the assistant could neither search for nor open a ticket.
      - >-
        Check that the final assistant reply tells the user that the ticketing system could
        not be reached or is unavailable right now.
      - >-
        Check that the reply does not claim that a ticket was created or opened, gives no
        ticket id, and does not suggest that a search found no existing ticket (no search
        succeeded).
fake:
  - - tool_calls:
        - name: search_tickets
          args: {query: outlook sync}
    - content: >-
        I couldn't reach the ticketing system: it is unavailable right now, so I could
        not check for an existing ticket or open one. Please try again in a few minutes.
