id: status_question
title: Status question -> get_ticket, no write proposed
plan_case: 3
user_id: alice
scenario: >-
  alice asks for news on INC-0007, her laptop battery replacement.
expected_outcome: >-
  The agent reads INC-0007 with get_ticket and answers with its real status and latest
  comment; no write is proposed.
turns:
  - message: What's happening with INC-0007? Any news on my laptop battery replacement?
    expect:
      status: ok
      # Facts that only INC-0007 holds, never a word the user typed: its status (or its
      # team), and its comment "Replacement battery ordered, ETA 3 working days."
      reply_matches:
        - (?i)\bin[ _-]?progress\b|\bbeing (worked on|handled)\b|\bendpoint[ _-]team\b
        - (?i)\bordered\b|\bon order\b|\bETA\b|\b(3|three) (working|business) days\b
      tool_calls_include: [get_ticket]
expect:
  tools_called_in_order_contains: [get_ticket]
  tools_not_called: [create_ticket, add_comment]
  max_proposals: 0
  writes_executed: 0
  no_invented_ticket_ids: true
  final_status: ok
judge:
  - name: answers_from_the_ticket
    tools: true
    evaluation_steps:
      - >-
        The user asks about INC-0007, their laptop battery replacement. Find the get_ticket
        result for INC-0007 in the tool calls.
      - >-
        Check that the final assistant reply gives the ticket's current status as that
        result states it (for example in progress), or the team working on it.
      - >-
        Check that the final reply passes on at least one fact from the ticket's comments,
        such as the replacement battery having been ordered or when it is expected.
      - >-
        Check that the final reply states nothing about the ticket that the get_ticket
        result does not support.
fake:
  - - tool_calls:
        - name: get_ticket
          args: {ticket_id: INC-0007}
    - content: >-
        INC-0007 is in progress with the endpoint team. A replacement battery was
        ordered, with an ETA of 3 working days.
