id: status_question
title: Status question -> get_ticket, no write proposed
plan_case: 3
user_id: alice
turns:
  - message: What's happening with INC-0007? Any news on my laptop battery replacement?
    expect:
      status: ok
      # Facts that only INC-0007 holds, never a word the user typed: its status (or its
      # team), and its comment "Replacement battery ordered, ETA 3 working days."
      reply_matches:
        - (?i)\bin[ _-]?progress\b|\bbeing (worked on|handled)\b|\bendpoint[ _-]team\b
        - (?i)\bordered\b|\bon order\b|\bETA\b|\b(3|three) (working|business) days\b
      tool_calls_include: [get_ticket]
expect:
  tools_called_in_order_contains: [get_ticket]
  tools_not_called: [create_ticket, add_comment]
  max_proposals: 0
  writes_executed: 0
  no_invented_ticket_ids: true
  final_status: ok
fake:
  - - tool_calls:
        - name: get_ticket
          args: {ticket_id: INC-0007}
    - content: >-
        INC-0007 is in progress with the endpoint team. A replacement battery was
        ordered, with an ETA of 3 working days.
